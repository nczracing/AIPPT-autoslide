<!DOCTYPE html><html><head><meta charset="UTF-8"><title>预览 - 主题展示 - creative</title><style>body { font-family: "Microsoft YaHei", sans-serif; padding: 24px; background: linear-gradient(160deg, #fffdff, #f4eaf6); min-height: 100vh; }.slide { background: #ffffff; border-radius: 12px; padding: 34px 40px; margin: 24px 0; box-shadow: 0 4px 18px rgba(0,0,0,0.10); border-top: 4px solid #993399; position: relative; overflow: hidden; }.deco { position: absolute; border-radius: 50%; pointer-events: none; }.slide h2 { color: #660066; margin: 0 0 14px; font-size: 24px; padding-bottom: 10px; border-bottom: 2px solid #993399; }.detail { color: #2d282d; font-size: 15px; line-height: 1.8; margin: 0 0 14px; }.slide ul { line-height: 1.9; margin: 0; padding-left: 4px; list-style: none; }.slide li { margin: 8px 0; padding-left: 18px; position: relative; font-weight: 600; color: #993399; }.slide li::before { content: "●"; position: absolute; left: 0; color: #993399; }.imgbox { margin: 14px 0; text-align: center; }.imgbox img { max-width: 62%; border-radius: 8px; border: 2px solid #993399; box-shadow: 0 4px 14px rgba(0,0,0,0.15); }}.notes { color: #777; font-size: 13px; font-style: italic; margin-top: 16px; padding-top: 10px; border-top: 1px solid #eee; }</style></head><body><h1 style="color:#660066">主题展示 - creative</h1><div class="slide"><div class="deco" style="right:-40px; top:-40px; width:188px; height:188px; background:#dcc4e2; opacity:0.55;"></div><h2>1. 软件工程职业规划</h2><p class="detail">从竞赛到工程的长期成长路线</p></div><div class="slide"><div class="deco" style="left:-40px; top:-40px; width:166px; height:166px; background:#f5ddfb; opacity:0.55;"></div><h2>2. 个人定位</h2><p class="detail">通过三年竞赛与项目历练，我明确了自身定位：以扎实的算法基础为底盘，聚焦后端与系统方向，兼顾工程落地能力，追求可持续的长期成长而非短期投机。</p><ul><li>兴趣方向：后端工程</li><li>能力盘点：算法与系统</li><li>价值观：长期主义</li></ul></div><div class="slide"><div class="deco" style="right:-40px; top:-40px; width:161px; height:161px; background:#f1d9f7; opacity:0.55;"></div><h2>3. 发展路径</h2><p class="detail">发展路径存在三种选择：技术路线追求专业纵深，管理路线强调团队与资源整合，复合路线以 T 型能力兼顾两者。</p><ul><li>技术路线：纵深</li><li>管理路线：横向</li><li>复合路线：T 型</li></ul></div></body></html>
